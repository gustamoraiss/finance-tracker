<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar</title>
</head>
<body>
    <h1>Editar Transação</h1>

    <form action="/editar/{{ transacao[0] }}" method="POST">
        <label for="valor">Valor:</label>
        <input type="number" step="0.01" name="valor" id="valor" value="{{ transacao[1] }}" required>
        <br>

        <label for="tipo">Tipo:</label>
        <select name="tipo" id="tipo" required>
            <option value="receita" {% if transacao[2] == 'receita' %}selected{% endif %}>Receita</option>
            <option value="despesa" {% if transacao[2] == 'despesa' %}selected{% endif %}>Despesa</option>
        </select>
        <br>

        <label for="categoria">Categoria:</label>
        <select name="categoria" id="categoria" required>
            <option value="alimentacao" {% if transacao[3] == 'alimentacao' %}selected{% endif %}>Alimentação</option>
            <option value="transporte" {% if transacao[3] == 'transporte' %}selected{% endif %}>Transporte</option>
            <option value="lazer" {% if transacao[3] == 'lazer' %}selected{% endif %}>Lazer</option>
            <option value="estudos" {% if transacao[3] == 'estudos' %}selected{% endif %}>Estudos</option>
            <option value="outros" {% if transacao[3] == 'outros' %}selected{% endif %}>Outros</option>
        </select>
        <br>

        <label for="data">Data:</label>
        <input type="date" name="data" id="data" value="{{ transacao[4] }}" required>
        <br>

        <label for="descricao">Descrição (opcional):</label>
        <input type="text" name="descricao" id="descricao" value="{{ transacao[5] }}">
        <br>

        <button type="submit">Salvar alterações</button>
    </form>
</body>
</html>
